name: Auto-Update Daily Panchangam

on:
  schedule:
    # Runs every day at 00:00 UTC
    - cron: '0 */2 * * *'
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install astronomy-engine

      - name: Run Panchang Generator Script
        run: node scripts/generate_panchang.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add data/dynamic-events.json
          git commit -m "Auto-update daily panchang JSON [skip ci]" || echo "No changes to commit"
          git push
